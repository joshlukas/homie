# Homie – startet ohne Vorkonfiguration:
#   Portainer: Stacks → Add stack → Repository → diese Datei (Standardpfad docker-compose.yml)
#   Ohne Portainer: docker compose up -d
# Alle Einstellungen sind freiwillig, siehe .env.example.

name: homie

services:
  homie:
    image: ghcr.io/joshlukas/homie:latest   # fertiges Image, von GitHub aus diesem Repository gebaut
    build: .                                 # Rückfall: lässt sich das Image nicht laden, wird hier gebaut
    pull_policy: always                      # bei jedem Start nach einem neueren Image sehen
    container_name: homie
    restart: unless-stopped
    # Im Heimnetz des Rechners (kein abgeschottetes Docker-Netz): nur so kann Homie später
    # Geräte und Dienste im Heimnetz selbst finden. Erreichbar unter http://<Rechner>:8090
    network_mode: host
    environment:
      HOMIE_PORT: ${HOMIE_PORT:-8090}
      HOMIE_DOCKER_LESEN: ${HOMIE_DOCKER_LESEN:-1}
      HOMIE_DOCKER_URL: http://127.0.0.1:${HOMIE_DOCKER_PORT:-23750}
      HOMIE_MASTER_KEY: ${HOMIE_MASTER_KEY:-}
      HOMIE_YAMTRACK_SCHREIBEN: ${HOMIE_YAMTRACK_SCHREIBEN:-0}
      HOMIE_YAMTRACK_URL: http://127.0.0.1:${HOMIE_YAMTRACK_PORT:-23751}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - homie-daten:/data          # alles Private: Konto, Erkanntes, verschlüsselte Schlüssel
      - homie-bilder:/bilder:ro    # Bilder für das „Bild des Tages“ auf „Mein Tag“; Homie liest hier nur
      # Freiwillig, nur wenn Yamtrack auf demselben Rechner läuft: seine Datenbank nur lesbar einhängen,
      # dann zeigt „Mein Tag“ auch Gesehenes. Den Namen des Volumes zeigt „docker volume ls“.
      # - yamtrack_db:/yamtrack:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: &protokoll
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Zwischendienst: gibt Homie einen NUR LESENDEN Blick auf Docker (welche Container laufen).
  # Homie selbst bekommt den Docker-Zugang nie direkt. Abschalten: HOMIE_DOCKER_LESEN=0
  docker-lesen:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: homie-docker-lesen
    restart: unless-stopped
    deploy:
      replicas: ${HOMIE_DOCKER_LESEN:-1}
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      INFO: 1
      VERSION: 1
      PING: 1
      POST: 0                      # nichts starten, stoppen, ändern oder löschen
      EXEC: 0
      SECRETS: 0
      AUTH: 0
    ports:
      - "127.0.0.1:${HOMIE_DOCKER_PORT:-23750}:2375"   # nur auf diesem Rechner, nicht im Heimnetz
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt: ["no-new-privileges:true"]
    logging: *protokoll

  # Freiwillig (HOMIE_YAMTRACK_SCHREIBEN=1), nur wenn Yamtrack auf demselben Rechner läuft: trägt Gesehenes aus
  # Sprachnotizen in Yamtrack ein. Dafür braucht dieser Helfer den Docker-Zugang – er, nicht Homie. Er lauscht nur
  # auf diesem Rechner, kennt genau zwei Aufträge (Titel suchen, Gesehenes eintragen) und führt nur sein festes
  # Programm im Container HOMIE_YAMTRACK_CONTAINER aus. Wer den Docker-Zugang hat, könnte grundsätzlich alles auf
  # dem Rechner – deshalb ist der Helfer von Haus aus abgeschaltet.
  yamtrack-helfer:
    image: ghcr.io/joshlukas/homie:latest
    pull_policy: always
    container_name: homie-yamtrack-helfer
    restart: unless-stopped
    deploy:
      replicas: ${HOMIE_YAMTRACK_SCHREIBEN:-0}
    command: ["python", "-m", "homie", "yamtrack-helfer"]
    network_mode: host               # lauscht nur auf 127.0.0.1, siehe homie/__main__.py
    user: "0:0"                      # der Docker-Zugang gehört root; alle Sonderrechte sind unten entzogen
    environment:
      HOMIE_YAMTRACK_PORT: ${HOMIE_YAMTRACK_PORT:-23751}
      HOMIE_YAMTRACK_CONTAINER: ${HOMIE_YAMTRACK_CONTAINER:-yamtrack}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      disable: true
    logging: *protokoll

  # Freiwillig (HOMIE_BILDER_FREIGABE=1): gibt den Bilder-Ordner im Heimnetz als Windows-Freigabe (Samba) frei, zum
  # Lesen und Schreiben: smb://<Rechner>/bilder (Windows: \\<Rechner>\bilder). Was dort liegt, zeigt „Mein Tag“ als Bild des Tages.
  # OHNE Passwort: Jedes Gerät, das den Rechner im Heimnetz erreicht, kann Bilder ablegen und löschen. Angenommen werden
  # nur Geräte mit privater Adresse (Heimnetz, VPN). Die Freigabe sieht ausschließlich diesen einen Ordner.
  # Gebaut wird sie beim ersten Start auf dem Rechner selbst, aus dem offiziellen Alpine-Abbild und dessen Samba-Paket.
  bilder-freigabe:
    image: homie-bilder-freigabe:lokal
    pull_policy: build
    build:
      dockerfile_inline: |
        FROM alpine:3.22
        RUN apk add --no-cache samba && mkdir /bilder
        COPY <<EOF /etc/samba/smb.conf
        [global]
          server role = standalone server
          server string = Homie Bilder
          map to guest = Bad User
          guest account = nobody
          server min protocol = SMB2
          hosts allow = 127. 10. 192.168. 172.16. 172.17. 172.18. 172.19. 172.20. 172.21. 172.22. 172.23. 172.24. 172.25. 172.26. 172.27. 172.28. 172.29. 172.30. 172.31.
          hosts deny = ALL
          load printers = no
          printing = bsd
          printcap name = /dev/null
          disable spoolss = yes
          disable netbios = yes
          smb ports = 445
          log level = 1
        [bilder]
          comment = Bilder fuer das Bild des Tages in Homie
          path = /bilder
          guest ok = yes
          guest only = yes
          read only = no
          create mask = 0644
          directory mask = 0755
          veto files = /*.exe/*.html/*.htm/*.svg/*.js/
        EOF
    container_name: homie-bilder-freigabe
    restart: unless-stopped
    deploy:
      replicas: ${HOMIE_BILDER_FREIGABE:-0}
    # Der Ordner gehört danach dem rechtlosen Benutzer, unter dem alle Zugriffe laufen.
    command: ["sh", "-c", "mkdir -p /var/lib/samba/private && chown nobody:nobody /bilder && exec smbd --foreground --no-process-group --debug-stdout"]
    ports:
      - "${HOMIE_BILDER_PORT:-445}:445"
    volumes:
      - homie-bilder:/bilder
    read_only: true
    tmpfs:
      - /var/lib/samba
      - /var/cache/samba
      - /run/samba
      - /var/log/samba
      - /tmp
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    logging: *protokoll

volumes:
  homie-daten:
    name: homie-daten
  homie-bilder:
    name: homie-bilder

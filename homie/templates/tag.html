<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121530">
<meta name="robots" content="noindex, nofollow">
<title>Homie – Mein Tag</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/schrift/schrift.css">
<link rel="stylesheet" href="/static/mein-tag.css">
<script src="/static/mein-tag.js" defer></script>
</head>
<body data-csrf="{{ csrf }}">
<nav class="menue" aria-label="Hauptmenü"><a class="marke" href="/"><i></i><span>Homie</span></a><div class="tabs">
{%- for m in menue %}<a href="{{ m.pfad }}"{% if pfad == m.pfad %} aria-current="page"{% endif %}>{{ m.titel }}</a>{% endfor %}
{%- for s in eigene_seiten %}<a href="/s/{{ s.id }}">{{ s.titel }}</a>{% endfor %}</div>
<form method="post" action="/logout" class="abmelden"><input type="hidden" name="csrf" value="{{ csrf }}"><button type="submit">Abmelden</button></form></nav>

<header>
  <div><h1>Mein Tag</h1><p id="sub">Lade …</p></div>
  <span class="spacer"></span>
  <div class="seg" role="group" aria-label="Zeitraum">
    <button data-d="1">Heute</button><button data-d="7" aria-pressed="true">7 Tage</button><button data-d="30">30 Tage</button><button data-d="90">90 Tage</button>
  </div>
</header>
<main>
  <div id="errors"></div>
  <section class="tiles" id="tiles"></section>
  <section class="grid" id="grid"></section>
</main>
</body>
</html>

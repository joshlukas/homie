<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121530">
<meta name="robots" content="noindex, nofollow">
<title>Homie – Mein Tag</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/schrift/schrift.css">
<link rel="stylesheet" href="/static/mein-tag.css">
<link rel="stylesheet" href="/static/menue.css">
<script src="/static/menue.js" defer></script>
<script src="/static/mein-tag.js" defer></script>
</head>
<body data-csrf="{{ csrf }}">
{% include "_menue.html" %}

<header>
  <div><h1>Mein Tag</h1><p id="sub">Lade …</p></div>
</header>
<main>
  <div id="errors"></div>
  <section class="guide" id="guide">
    <a class="bildtag" id="bildtag" hidden target="_blank" rel="noopener" title="Bild des Tages – in voller Größe öffnen"><img alt="Bild des Tages" decoding="async"><span>Bild des Tages</span></a>
    <div class="gkopf"><p id="gsatz" class="gsatz"></p><div class="ampeln" id="ampeln"></div></div>
  </section>
  <div class="zwei">
    <article class="card" id="hinweise" style="--c:var(--accent)"></article>
    <article class="card" id="agenda" style="--c:var(--sky)"></article>
  </div>
  <section id="entscheiden"></section>
  <div class="rueck"><h3 class="gruppe"><span>Details und Rückblick</span></h3>
    <div class="seg" role="group" aria-label="Zeitraum für Notiertes">
      <button data-d="1">Heute</button><button data-d="7" aria-pressed="true">7 Tage</button><button data-d="30">30 Tage</button><button data-d="90">90 Tage</button>
    </div>
  </div>
  <section id="grid"></section>
</main>
</body>
</html>

{% extends "basis.html" %}
{% block titel %}Homie – Anmelden{% endblock %}
{% block koerper %}tor{% endblock %}
{% block inhalt %}
<section class="glas torkarte">
  <span class="logo gross" aria-hidden="true">H</span>
  <h1>Homie</h1>
  <p class="leiser">Bitte melde dich an.</p>
  {% if fehler %}<p class="meldung" role="alert">{{ fehler }}</p>{% endif %}
  <form method="post" action="/login">
    <label for="passwort">Passwort</label>
    <input id="passwort" name="passwort" type="password" autocomplete="current-password" required autofocus>
    <button type="submit">Anmelden</button>
  </form>
</section>
{% endblock %}
